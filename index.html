<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#F4EDE2;--card:#FBF8F3;--card-2:#F0E7DA;--line:#E8DDCC;--field:#F4EDE2;
 --ink:#352D29;--ink-2:#827465;--ink-3:#A39585;--ink-c:#352D29;--ink-c2:#827465;--ink-c3:#A39585;
 --cocoa:#8F6D5D;--on-cocoa:#FFFFFF;--grad:#C58299;--accent-bg:#8F6D5D;
 --pa:#C58299;--pb:#6686A3;--focus:#6686A3;--danger:#B04E45;--warn:#A9762B;--ok:#5E8A50;
 --shadow:0 1px 2px rgba(53,45,41,.05);--sheet-shadow:0 -8px 32px rgba(53,45,41,.14);
 color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-pal="blue"]{--bg:#EDF3F8;--card:#FFFFFF;--card-2:#E3ECF4;--line:#D3E0EB;--field:#F3F7FB;--ink:#1E2A35;--ink-2:#5B6E7E;--ink-3:#8698A7;--ink-c:#1E2A35;--ink-c2:#5B6E7E;--ink-c3:#8698A7;--cocoa:#2A6F9E;--grad:#4FA3C7;--accent-bg:#2A6F9E}
:root[data-pal="sage"]{--bg:#EDF1E8;--card:#FBFCF8;--card-2:#E2E9DA;--line:#D5DECB;--field:#F1F4EC;--ink:#2B3328;--ink-2:#667262;--ink-3:#93A08D;--ink-c:#2B3328;--ink-c2:#667262;--ink-c3:#93A08D;--cocoa:#6A8A5E;--grad:#A7BF8C;--accent-bg:#6A8A5E}
/* Dark: backdrop gelap, kotak cerah */
:root[data-theme="dark"]{--bg:#1E1915;--card:#F7F0E6;--card-2:#ECE2D4;--line:#E2D5C3;--field:#FFFFFF;--ink:#F3EBE1;--ink-2:#C8B9A8;--ink-3:#9C8E80;--ink-c:#33291F;--ink-c2:#7A6A5B;--ink-c3:#A08F7F;--accent-bg:#E7C4B1;--shadow:0 2px 10px rgba(0,0,0,.35);--sheet-shadow:0 -8px 32px rgba(0,0,0,.5);color-scheme:dark}
:root[data-theme="dark"][data-pal="blue"]{--bg:#0F1A24;--card:#F2F7FB;--card-2:#E0EAF3;--line:#CFDDE9;--ink:#E8F0F7;--ink-2:#A9BCCB;--ink-3:#7F93A3;--ink-c:#1B2833;--ink-c2:#566B7C;--ink-c3:#8597A6;--accent-bg:#8CC6E6}
:root[data-theme="dark"][data-pal="sage"]{--bg:#151B14;--card:#F2F5EE;--card-2:#E1E8D8;--line:#D2DCC6;--ink:#EBF0E6;--ink-2:#B6C2AE;--ink-3:#8A9685;--ink-c:#263023;--ink-c2:#62705D;--ink-c3:#909C8A;--accent-bg:#BFD6A8}
.card,.mcard,.ftile,.sheet,.chip,.seg,.btn,input,select,textarea,.nav,.md,.ib,.who-btn,.stp button,.toast{--ink:var(--ink-c);--ink-2:var(--ink-c2);--ink-3:var(--ink-c3);color:var(--ink)}
.swatch{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink-c);font-weight:600;text-align:left}
.swatch[aria-pressed="true"]{border-color:var(--ink-c);box-shadow:inset 0 0 0 1px var(--ink-c)}
.swatch .dots{display:flex}.swatch .dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--card);margin-left:-6px}.swatch .dots i:first-child{margin-left:0}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{background:var(--bg)}
body{margin:0;font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.disp{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.stack{display:grid;gap:12px}

/* Shell */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.tools{display:flex;gap:6px;align-items:center}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;position:relative;flex:none}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.avbtn{border:0;background:none;padding:0;border-radius:50%}
main{max-width:760px;margin:0 auto;padding:4px 18px 110px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;min-width:0;border:0;background:none;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:6px 0;border-radius:12px}
.nav button{transition:background .2s,color .2s}
.nav button[aria-current="page"]{color:#fff;background:linear-gradient(135deg,var(--cocoa) 0%,var(--grad) 100%);box-shadow:0 4px 12px color-mix(in srgb,var(--cocoa) 35%,transparent);margin:0 3px}
.nav button[aria-current="page"] svg{stroke-width:2.2}
.nav .side{display:none}
@media (min-width:900px){
 .nav{top:0;right:auto;width:220px;flex-direction:column;gap:2px;padding:calc(18px + env(safe-area-inset-top,0px)) 12px;border-top:0;border-right:1px solid var(--line)}
 .nav .side{display:flex;margin:0 8px 18px}
 .nav button{flex:none;flex-direction:row;gap:12px;font-size:14px;padding:10px 12px;color:var(--ink-2)}
 .nav button[aria-current="page"]{color:#fff;margin:0}
 .app{padding-left:220px}.topbar .brand{visibility:hidden}
}

/* Type & sections */
.ph{margin:8px 0 14px}
.ph h1{font-size:28px;line-height:1.1;margin:0}
.ph p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 8px;font-size:15px;font-weight:700}
.sec-h .link{font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.card+.card{margin-top:10px}
.link{border:0;background:none;padding:6px 0;color:var(--accent-bg);font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:4px}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
a.btn{text-decoration:none}
.btn.pri{background:var(--cocoa);border-color:var(--cocoa);color:var(--on-cocoa)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:38px;padding:7px 14px;font-size:13.5px;border-radius:12px}
.btn.block{width:100%}
.add-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;margin:12px 0 4px;border:0;border-radius:16px;background:var(--cocoa);color:var(--on-cocoa);font-size:16px;font-weight:700;box-shadow:0 2px 8px color-mix(in srgb,var(--cocoa) 28%,transparent)}
.add-btn:active{transform:scale(.99)}
.btn:disabled{opacity:.5;cursor:default}
.btn.wa{color:#1f7a4d;border-color:color-mix(in srgb,#25D366 40%,var(--line))}
:root[data-theme="dark"] .btn.wa{color:#6fd7a2}
.seg{display:inline-flex;background:var(--card-2);border-radius:13px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:none;padding:7px 14px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(53,45,41,.1)}
.seg.full{display:flex}.seg.full button{flex:1;justify-content:center}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chip{min-height:38px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink-c);border-color:var(--ink-c);color:var(--card)}
.chip.add{border-style:dashed}
input,select,textarea{width:100%;min-height:48px;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--field);font-size:16px}
input[type=checkbox]{min-height:0}
textarea{min-height:72px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--cocoa);flex:none}
.field{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-weight:400;color:var(--ink-3);font-size:12px}
.field.err input,.field.err select{border-color:var(--danger)}
.field .msg{color:var(--danger);font-weight:500;font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checkline{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:500;color:var(--ink)}
.quick{display:flex;gap:8px;align-items:stretch}
.quick input{flex:1;min-width:0}
.quick .qty{width:72px;flex:none;text-align:center}
.quick .btn{min-height:48px;padding:0 18px;font-size:15px}

/* People */
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;background:var(--c);flex:none}
.av.sm{width:22px;height:22px;font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.who{display:inline-flex;align-items:center;gap:5px}

/* Lists */
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-height:58px}
.list>li:first-child{border-top:0}
.rb{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;border-radius:10px}
.rb:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.title{font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.ck{width:24px;height:24px;border-radius:8px;border:1.6px solid var(--ink-3);background:transparent;display:grid;place-items:center;padding:0;flex:none;color:var(--on-cocoa)}
.ck[aria-checked="true"]{background:var(--cocoa);border-color:var(--cocoa)}
.done .title{text-decoration:line-through;color:var(--ink-3);font-weight:500}
.group-h{font-size:12.5px;font-weight:700;color:var(--ink-2);margin:14px 2px 2px;display:flex;justify-content:space-between}
.group-h.red{color:var(--danger)}
.empty{text-align:center;padding:22px 10px;color:var(--ink-2)}
.empty p{margin:0 0 12px}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--card-2);color:var(--ink-2)}
.pill.low{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.out,.pill.red{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.stp{display:flex;align-items:center;gap:2px}
.stp button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;font-size:17px}
.stp span{min-width:30px;text-align:center;font-weight:700}
.bar{height:6px;border-radius:999px;background:var(--card-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--cocoa));border-radius:inherit}

/* Home */
.hello{padding:10px 2px 6px}
.hello .date{color:var(--ink-2);font-size:14px;margin:0}
.hello h1{font-size:clamp(44px,13vw,64px);line-height:.98;margin:6px 0 4px;font-weight:700}
.hello .pair{display:inline-flex;vertical-align:middle;margin-left:6px}
.hello p{margin:0;color:var(--ink-2)}
.trow{display:flex;align-items:center;gap:12px;padding:10px 0}
.trow+.trow{border-top:1px solid var(--line)}
.ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--card-2);color:var(--cocoa)}
.money{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:grid;gap:2px}
.mcard .amt{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:clamp(22px,6.5vw,30px);font-weight:700;color:var(--c);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--cocoa) 10%,var(--card));border-color:color-mix(in srgb,var(--cocoa) 30%,var(--line))}

/* Calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mh{font-size:11.5px;color:var(--ink-3);text-align:center;padding:4px 0;font-weight:600}
.md{border:0;background:var(--card);border-radius:12px;min-height:54px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.md.out{background:transparent;color:var(--ink-3)}
.md .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:600}
.md.today .n{background:var(--cocoa);color:var(--on-cocoa)}
.md[aria-pressed="true"]{outline:2px solid var(--cocoa);outline-offset:-2px}
.md .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:36px}
.ev{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .bar-v{width:4px;align-self:stretch;border-radius:4px;background:var(--c)}
.ev.ghost{opacity:.6}

/* Sheet, confirm, toast */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(28,24,21,.38);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-radius:24px 24px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--sheet-shadow)}
.sheet.open{transform:none}
@media (min-width:900px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:480px;max-height:86vh;border-radius:24px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}.sheet.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 8px}
.sh-h h2{margin:0;font-size:18px}
.sh-b{padding:4px 18px 18px;overflow:auto;display:grid;gap:14px}
.sh-a{display:flex;gap:8px;justify-content:space-between;align-items:center;padding-top:4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger);color:#fff}
@media (min-width:900px){.toast{bottom:28px}}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-box{width:100%;max-width:360px;text-align:center}
.login h1{font-size:40px;margin:12px 0 6px}
.who-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;margin-top:10px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:16px;font-weight:600;text-align:left}
.who-btn small{display:block;font-weight:400;color:var(--ink-3);font-size:13px}
details.tip{border-top:1px solid var(--line);padding:11px 0}
details.tip:first-of-type{border-top:0}
details.tip summary{cursor:pointer;font-weight:600}
details.tip p,details.tip ul{margin:8px 0 0;color:var(--ink-2);font-size:14px}
details.tip ul{padding-left:18px}
.sync{font-size:11.5px;font-weight:600;color:var(--ink-3);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync[data-s="saving"]::before{background:var(--warn)}
.sync[data-s="error"]{color:var(--danger)}.sync[data-s="error"]::before{background:var(--danger)}
.status{text-align:center}.status h1{font-size:28px;margin:12px 0 6px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ftile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:6px;min-height:104px;align-content:start}
.ftile:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ftile .fi{color:var(--cocoa)}
.ftile .fn{font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.ftile.new{border-style:dashed;color:var(--ink-2)}
.crumb{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.crumb h2{margin:0;font-size:20px;flex:1;min-width:0;overflow-wrap:anywhere}
.fcard{display:grid;align-content:start;gap:0}
.fcard .rowx{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2);padding:2px 0}
.fcard .rowx b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.fcard .tagline{min-height:22px;display:flex;align-items:center}
.card .link,.sheet .link{color:var(--cocoa)}
.pal-row{display:flex;gap:14px;flex-wrap:wrap}
.pal{border:0;background:none;padding:4px;border-radius:50%}
.pal-c{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.pal[aria-pressed="true"] .pal-c{outline:3px solid var(--ink-c);outline-offset:3px}
.cpick{display:flex;gap:8px;flex-wrap:wrap}
.cpick button{width:36px;height:36px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;color:#fff}
.cpick button[aria-pressed="true"]{outline:3px solid var(--ink-c);outline-offset:2px}
.soon{text-align:center;padding:40px 16px}
.soon h2{margin:8px 0}
</style>
</head>
<body>
<div id="login" class="login"><div class="login-box"><h1 class="disp">Our Space</h1><p class="muted">Loading…</p></div></div>
<div id="app" class="app" hidden>
 <header class="topbar">
  <div class="row" style="gap:10px;min-width:0"><div class="brand" id="brand"></div><span class="sync" id="sync" data-s="ok" role="status" aria-live="polite" hidden></span></div>
  <div class="tools">
   <button class="ib" data-a="guide" id="bGuide" aria-label="Cara guna"></button>
   <button class="ib" data-a="foryou" id="bBell" aria-label="Untuk kau"></button>
   <button class="ib" data-a="theme" id="bTheme" aria-label="Tema & warna"></button>

/* ================= Sync with Google Sheets (Apps Script only) ================= */
const gas=(fn,...a)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a));
const CACHE='ourspace.cache',PEND='ourspace.pending';
const SH_TABLES=['tasks','categories','inventory','shopping','goals','contribs','files','activity'];
function emptyDb(){return{tasks:[],files:[],categories:[],inventory:[],shopping:[],meals:{},commitments:[],occ:[],incomeLines:{pa:{},pb:{}},balOverride:{pa:{},pb:{}},goals:[],contribs:[],
 phones:{pa:'',pb:''},brief:{pa:{on:false,time:'07:00'},pb:{on:false,time:'07:00'}},activity:[],seen:{pa:0,pb:0},names:{pa:'',pb:''},colors:{pa:'',pb:''}}}
let srv={email:'',url:''},snap={},pending=[],flushing=false,fTimer=null,lastRefresh=0;
if(IS_GAS)pending=load(PEND)||[];
function fromServer(d){
 const out=emptyDb(),set={},pj=(s,f)=>{try{return s?JSON.parse(s):f}catch(e){return f}};
 (d.settings||[]).forEach(r=>set[r.id]=r.value);
 SH_TABLES.forEach(k=>out[k]=d[k]||[]);
 out.activity.sort((a,b)=>b.at-a.at);
 (d.meals||[]).forEach(m=>out.meals[m.id]={name:m.name,ing:m.ing||[]});
 out.commitments=(d.sharedCom||[]).slice();out.occ=(d.sharedOcc||[]).slice();
 ['pa','pb'].forEach(p=>{const f=(d.fin||{})[p]||{};
  out.commitments.push(...(f.commitments||[]));out.occ.push(...(f.occ||[]));
  (f.income||[]).forEach(l=>{(out.incomeLines[p][l.month]=out.incomeLines[p][l.month]||[]).push({id:l.id,name:l.name,amount:l.amount,type:l.type})});
  (f.balov||[]).forEach(o=>{if(o.value!==''&&o.value!=null)out.balOverride[p][o.month]=num(o.value)});
  out.seen[p]=num(set['seen_'+p]);out.names[p]=set['name_'+p]||'';out.colors[p]=set['color_'+p]||'';out.brief[p]=pj(set['brief_'+p],{on:false,time:'07:00'});out.phones[p]=set['phone_'+p]||''});
 return out;
}
function flat(){
 const me=ME(),o={};SH_TABLES.forEach(k=>o[k]=db[k]);
 o.meals=Object.entries(db.meals).map(([id,m])=>({id,name:m.name,ing:m.ing}));
 const own=c=>c.owner;const cOwner={};db.commitments.forEach(c=>cOwner[c.id]=c.owner);
 o.sharedCom=db.commitments.filter(c=>own(c)==='shared');o.sharedOcc=db.occ.filter(x=>cOwner[x.cid]==='shared');
 o[`fin:${me}:commitments`]=db.commitments.filter(c=>own(c)===me);
 o[`fin:${me}:occ`]=db.occ.filter(x=>cOwner[x.cid]===me);
 o[`fin:${me}:income`]=[];Object.entries(db.incomeLines[me]||{}).forEach(([m,ls])=>ls.forEach(l=>o[`fin:${me}:income`].push({id:l.id,month:m,name:l.name,amount:l.amount,type:l.type})));
 o[`fin:${me}:balov`]=Object.entries(db.balOverride[me]||{}).map(([m,v])=>({id:m,month:m,value:v}));
 o.settings=[{id:'seen_'+me,value:String(db.seen[me]||0)},{id:'brief_'+me,value:JSON.stringify(db.brief[me]||{})},{id:'phone_'+me,value:db.phones[me]||''},...['pa','pb'].flatMap(p=>[{id:'name_'+p,value:(db.names||{})[p]||''},{id:'color_'+p,value:(db.colors||{})[p]||''}])];
 return o;
}
function snapshot(){snap={};const f=flat();for(const k in f){snap[k]={};f[k].forEach(x=>snap[k][String(x.id)]=JSON.stringify(x))}}
const opKey=x=>x.t+'|'+(x.op==='put'?String(x.o.id):String(x.id));
function queue(op){const k=opKey(op);pending=pending.filter(x=>opKey(x)!==k);pending.push(op)}
function gasSave(){
 if(!ME())return;const f=flat();
 for(const k in f){const prev=snap[k]||{},cur={};
  f[k].forEach(x=>{const id=String(x.id),s=JSON.stringify(x);cur[id]=s;if(prev[id]!==s)queue({t:k,op:'put',o:JSON.parse(s)})});
  for(const id in prev)if(!(id in cur))queue({t:k,op:'del',id});snap[k]=cur}
 store(PEND,pending);store(CACHE,{me:ME(),db,srv});scheduleFlush();
}
function setSync(s){const el=$('#sync');if(!el)return;el.hidden=!IS_GAS;el.dataset.s=s;el.textContent=s==='saving'?'Saving…':s==='error'?'Offline':'Saved';el.title=s==='error'?'Tak dapat save. App cuba lagi sendiri.':''}
function scheduleFlush(ms=300){clearTimeout(fTimer);setSync('saving');fTimer=setTimeout(flush,ms)}
let errShown=false;
function flush(){
 if(flushing)return Promise.resolve();if(!pending.length){setSync('ok');return Promise.resolve()}
 flushing=true;setSync('saving');const batch=pending.slice(0,150);
 return gas('sync',batch).then(r=>{pending=pending.filter(x=>!batch.includes(x));store(PEND,pending);flushing=false;errShown=false;
   if(r&&r.rejected&&r.rejected.length){toast(`${r.rejected.length} perubahan ditolak server (tiada kebenaran). Data refresh.`,true);lastRefresh=0;refresh(true)}
   if(pending.length)return flush();setSync('ok')})
  .catch(err=>{flushing=false;setSync('error');if(!errShown){toast('Tak dapat save. App simpan dalam phone & cuba lagi.',true);errShown=true}if(/NO_ACCESS/.test(String(err)))return;fTimer=setTimeout(flush,6000)});
}
function applyServer(r){prefs.user=r.me;savePrefs();srv={email:r.email,url:r.url};db=fromServer(r.data);snapshot();store(CACHE,{me:r.me,db,srv})}
function statusScreen(h){$('#app').hidden=true;$('#login').hidden=false;$('#login').innerHTML=`<div class="login-box status">${mark(64)}${h}</div>`}
function showOrRender(){if($('#app').hidden)showApp();else if(!state.sheet)render();else state.dirty=true}
function bootGas(){
 const c=load(CACHE);
 if(c&&c.me&&c.db){prefs.user=c.me;db=Object.assign(emptyDb(),c.db);srv=c.srv||srv;snapshot();showApp();setSync(pending.length?'saving':'ok')}
 else statusScreen('<h1 class="disp">Our Space</h1><p class="muted">Loading…</p>');
 (pending.length?flush():Promise.resolve()).then(()=>gas('boot')).then(r=>{
  if(!r.me){statusScreen(`<h1 class="disp">Akses ditolak</h1><p class="muted">Email <b>${esc(r.email||'tak dikenali')}</b> takde dalam senarai Our Space.</p><p class="small muted">Tukar akaun Google, atau minta tambah email dalam CONFIG.</p>`);return}
  if(c&&c.me&&c.me!==r.me){pending=[];store(PEND,pending)}
  if(pending.length)return;applyServer(r);lastRefresh=Date.now();showOrRender();
 }).catch(e=>{const s=String(e&&e.message||e);if(c&&c.db){setSync('error');return}
  statusScreen(/SETUP_NEEDED/.test(s)?'<h1 class="disp">Setup belum siap</h1><p class="muted">Run function <b>setup</b> dalam Apps Script editor dulu.</p>':`<h1 class="disp">Tak dapat sambung</h1><p class="muted">Check internet, lepas tu cuba lagi.</p><button class="btn pri" data-a="retry-boot">Cuba lagi</button>`)});
}
function refresh(force){
 if(!IS_GAS||!ME()||$('#app').hidden)return;if(pending.length){flush();return}
 if(!force&&Date.now()-lastRefresh<15000)return;lastRefresh=Date.now();
 gas('boot').then(r=>{if(!r.me||pending.length)return;applyServer(r);showOrRender()}).catch(()=>setSync('error'));
}
if(IS_GAS){document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});setInterval(()=>{if(document.visibilityState==='visible')refresh()},60000)}
function fileToB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file)})}
async function upload(file,path){
 if(file.size>15*1024*1024)throw new Error('TOO_BIG');
 const data=await fileToB64(file);return gas('uploadFile',{path,name:file.name,mime:file.type||'application/octet-stream',data});
}
/* ================= Finance core ================= */
const activeC=m=>db.commitments.filter(c=>!c.archived&&c.start<=m&&(!c.endMonth||m<=c.endMonth)&&(c.repeat==='monthly'||c.start===m));
const occOf=(c,m)=>db.occ.find(o=>o.id===m+'|'+c.id);
const statusOf=(c,m)=>{const o=occOf(c,m);return o?o.status:'unpaid'};
const isChild=c=>!!c.via&&db.commitments.some(x=>x.id===c.via||(x.prevIds||[]).includes(c.via));
const kidsOf=(c,m)=>activeC(m).filter(x=>(x.via===c.id||(c.prevIds||[]).includes(x.via))&&statusOf(x,m)!=='skip');
const baseAmt=(c,m)=>{const o=occOf(c,m);return num(o&&o.amount!=null&&o.amount!==''?o.amount:c.amount)};
const amtOf=(c,m)=>{const o=occOf(c,m);if(o&&o.status==='paid'&&o.paidAmount!=null)return num(o.paidAmount);return baseAmt(c,m)+sum(kidsOf(c,m).map(k=>baseAmt(k,m)))};
const dueOf=(c,m)=>{const o=occOf(c,m);const d=num(o&&o.dueDay||c.dueDay);if(!d)return 0;const last=new Date(+m.slice(0,4),+m.slice(5),0).getDate();return Math.min(d,last)};
const listC=m=>activeC(m).filter(c=>!isChild(c));
const shareOf=(c,p)=>c.owner===p?1:c.owner==='shared'?.5:0;
const canFin=c=>c.owner===ME()||c.owner==='shared';
const netOf=ls=>sum(ls.filter(l=>l.type!=='out').map(l=>l.amount))-sum(ls.filter(l=>l.type==='out').map(l=>l.amount));

const canDelTask=t=>t.owner===ME()||t.owner==='shared'||t.createdBy===ME();

function stepDate(k,rep){const d=pk(k);if(rep==='daily')d.setDate(d.getDate()+1);else if(rep==='weekly')d.setDate(d.getDate()+7);else if(rep==='monthly'){const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last))}return dk(d)}
function nextDue(t){let n=stepDate(t.due||TK,t.repeat),g=0;while(n<=TK&&g++<800)n=stepDate(n,t.repeat);return n}
function completeTask(t){
 t.status='done';t.doneAt=Date.now();t.doneBy=ME();t.updatedAt=Date.now();
 let msg='Task siap ✓';
 if(t.repeat&&t.repeat!=='none'){
  if(!t.seriesId)t.seriesId=t.id;
  const due=nextDue(t),owner=t.rotate&&t.owner!=='shared'?(t.owner==='pa'?'pb':'pa'):t.owner;
  const exists=db.tasks.some(x=>x.seriesId===t.seriesId&&x.due===due&&x.id!==t.id);
  if(!exists){db.tasks.push(Object.assign({},t,{id:uid(),due,owner,status:'todo',doneAt:0,doneBy:'',createdAt:Date.now(),updatedAt:Date.now()}));
   msg=`Siap ✓ Next: ${relL(due)}${t.rotate&&owner!==t.owner?', giliran '+OWN[owner].n:''}`}
 }
 log(`completed ${q(t.title)}`,`completed ${q(t.title)}`,t.owner===ME()?[]:[PARTNER()],'task',t.id);
 return msg;
}
function taskMatches(t){
 if(state.tOwner!=='all'&&t.owner!==state.tOwner)return false;
 if(state.tDate==='today'&&t.due!==TK)return false;
 if(state.tDate==='overdue'&&!isOver(t))return false;
 if(state.tDate==='week'&&!(t.due&&t.due>=TK&&t.due<=T(6)))return false;
 return true;
}

const ST_L={ok:'In stock',low:'Running low',out:'Out'};
const invByName=n=>db.inventory.find(i=>i.name.trim().toLowerCase()===String(n).trim().toLowerCase());
function applyBought(s,on){
 const inv=s.invId&&db.inventory.find(i=>i.id===s.invId);
 if(on&&!s.stockApplied&&inv){inv.qty=num(inv.qty)+Math.max(1,num(s.qty));inv.updatedAt=Date.now();s.stockApplied=true}
 if(!on&&s.stockApplied&&inv){inv.qty=Math.max(0,num(inv.qty)-Math.max(1,num(s.qty)));inv.updatedAt=Date.now();s.stockApplied=false}
 if(!on&&s.stockApplied&&!inv)s.stockApplied=false;
}
function addToShop(name,qty,o){

 if(ex)return false;
 const inv=invByName(name);
 db.shopping.push(Object.assign({id:uid(),name:name.trim(),qty:Math.max(1,num(qty)||1),cat:'',owner:'',invId:inv?inv.id:'',addedBy:ME(),addedAt:Date.now(),bought:false,boughtAt:0,stockApplied:false},o||{}));
 return true;
}

 });

}

  const data={name,target:Math.round(target),owner:v.owner,deadline:v.deadline||''};
  if(v.id){const g=db.goals.find(x=>x.id===v.id);if(!g||!canGoal(g))return;Object.assign(g,data);toast('Goal saved');save();render();openGoal(g.id);return}
  const g=Object.assign({id:uid(),archived:false,createdBy:ME()},data);db.goals.push(g);if(g.owner==='shared')log(`created goal ${q(name)}`,`created goal ${q(name)}`,[PARTNER()],'goal',g.id);save();render();openGoal(g.id);toast('Goal ditambah');return;
 }
 if(k==='contrib'){
  const g=db.goals.find(x=>x.id===v.gid),amt=Number(v.amount);if(!g||!canGoal(g))return;if(!(amt>0)){toast('Isi jumlah lebih dari 0',true);return}
  db.contribs.push({id:uid(),goalId:g.id,who:ME(),amount:Math.round(amt*100)/100,date:TK});if(g.owner==='shared')log(`added ${fmt2(amt)} to ${q(g.name)}`,`added ${fmt2(amt)} to ${q(g.name)}`,[PARTNER()],'goal',g.id);
  save();render();openGoal(g.id);toast('Masuk tabung ✓');return;
 }
 if(k==='folder'){
  const name=(v.name||'').trim();fieldErr('fFoN',!name);if(!name)return;
  const dup=cats('folder').find(x=>x.name.toLowerCase()===name.toLowerCase()&&x.id!==v.id);if(dup){fieldErr('fFoN',true);$('#fFoN .msg').textContent='Folder nama ni dah ada.';return}
  if(v.id){const c=db.categories.find(x=>x.id===v.id);if(c)c.name=name;toast('Folder saved')}else{const c={id:uid(),area:'folder',name};db.categories.push(c);state.rFolder=c.id;toast('Folder dibuat')}
  save();closeSheet();render();return;
 }
 if(k==='file'){
  const me=ME(),p=PARTNER(),name=(v.name||'').trim(),fin=$('#fileIn');fieldErr('fFN',!name);
  if(!v.id&&IS_GAS){fieldErr('fFile',!(fin&&fin.files[0]));if(!(fin&&fin.files[0]))return}
  let folder=v.folder||'';if(folder==='__new'){const fnm=(v.folderNew||'').trim();fieldErr('fFold',!fnm);if(!fnm)return;const ex=cats('folder').find(x=>x.name.toLowerCase()===fnm.toLowerCase());if(ex)folder=ex.id;else{const nc={id:uid(),area:'folder',name:fnm};db.categories.push(nc);folder=nc.id}}
  if(!name)return;
  const tags=[];if(v.tagP)tags.push(p);if(v.tagMe)tags.push(me);
  if(v.id){const f=db.files.find(x=>x.id===v.id);if(!f||!canEditFile(f)){toast('Tak boleh ubah file ni.',true);closeSheet();return}const hadP=f.tags.includes(p);
   Object.assign(f,{name,folder,tags,expiry:v.expiry||'',note:(v.note||'').trim(),updatedAt:Date.now()});if(f.owner===me&&v.visibility)f.visibility=v.visibility;
   if(!hadP&&tags.includes(p)&&f.visibility!=='private')log(`tagged ${OWN[p].n} on ${q(f.name)}`,`tagged you on ${q(f.name)}`,[p],'file',f.id);toast('File saved')}
  else{let url='',driveId='';
   if(IS_GAS&&fin&&fin.files[0]){const btn=$('#fileBtn');btn.disabled=true;btn.textContent='Uploading…';try{const r=await upload(fin.files[0],['Files',catName(folder)]);url=r.url;driveId=r.id}catch(err){btn.disabled=false;btn.textContent='Upload';toast('Upload gagal. Check internet & cuba lagi.',true);return}}
   const f={id:uid(),name,folder,owner:me,visibility:v.visibility||'shared',tags,expiry:v.expiry||'',note:(v.note||'').trim(),url,driveId,addedAt:Date.now(),updatedAt:Date.now()};db.files.push(f);
   if(f.visibility!=='private')log(tags.includes(p)?`uploaded ${q(name)} and tagged ${OWN[p].n}`:`uploaded ${q(name)}`,tags.includes(p)?`uploaded ${q(name)} and tagged you`:`uploaded ${q(name)}`,tags.includes(p)?[p]:[],'file',f.id);toast('File uploaded')}
  save();closeSheet();render();return;
 }
 if(k==='names'){
  const na=(v.name_pa||'').trim(),nb=(v.name_pb||'').trim();fieldErr('fN_pa',!na);fieldErr('fN_pb',!nb);if(!na||!nb)return;
  if(na.toLowerCase()===nb.toLowerCase()){fieldErr('fN_pb',true);$('#fN_pb .msg').textContent='Nama mesti lain dari orang pertama.';return}
  db.names={pa:na,pb:nb};db.colors={pa:v.color_pa||DEF_COL.pa,pb:v.color_pb||DEF_COL.pb};applyNames();
  if(IS_GAS&&ME())save();else if(!IS_GAS)store(KEY,db);
  if(state.sheet==='names'){closeSheet();render();toast('Saved')}else if(IS_GAS&&ME())showApp();else showLogin();
  return;
 }
 if(k==='prefs'){
  const ph=String(v.phone||'').replace(/\D/g,'');const bad=ph&&!/^60\d{8,10}$/.test(ph);fieldErr('fPhone',bad);if(bad)return;
  db.phones[me]=ph;db.brief[me]={on:!!v.on,time:v.time,inc:{tasks:!!v.inc_tasks,bills:!!v.inc_bills,house:!!v.inc_house,cal:!!v.inc_cal}};save();closeSheet();render();toast('Settings saved');return;
 }
});

/* ================= Boot ================= */
mq.addEventListener&&mq.addEventListener('change',()=>{if(prefs.theme==='auto')applyTheme('auto')});
applyTheme(prefs.theme,prefs.pal||'cocoa');
if(IS_GAS)bootGas();else if(prefs.user&&OWN[prefs.user])showApp();else showLogin();
})();
</script>
</body>
</html>
